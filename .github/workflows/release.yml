name: Build APKs

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APKs
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :mobile:assembleDebug :tv:assembleDebug --no-daemon

      - name: Name release artifacts
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/TV_Gamepad_phone.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk dist/TV_Gamepad_Host_tv.apk

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TV_Gamepad_APKs
          path: |
            dist/TV_Gamepad_phone.apk
            dist/TV_Gamepad_Host_tv.apk
          if-no-files-found: error

      - name: Publish PR prerelease
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-${{ github.event.pull_request.number }}
          name: PR #${{ github.event.pull_request.number }} APKs
          body: |
            Debug APKs from ${{ github.event.pull_request.html_url }}
            Commit: `${{ github.event.pull_request.head.sha }}`
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.event.pull_request.head.sha }}
          files: |
            dist/TV_Gamepad_phone.apk
            dist/TV_Gamepad_Host_tv.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TV_Gamepad_phone.apk
            dist/TV_Gamepad_Host_tv.apk
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
