<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TV Gamepad</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="controller">
  <div class="shell">
    <header class="chrome">
      <div class="shoulders">
        <button class="shoulder" data-button="L2" data-trigger="lt" type="button">L2</button>
        <button class="shoulder" data-button="L1" type="button">L1</button>
      </div>
      <div class="chrome-mid">
        <div class="identity">
          <div class="brand">TV Gamepad</div>
          <div id="status" class="status">Not connected</div>
        </div>
        <input id="pin" placeholder="PIN" maxlength="4" inputmode="numeric" autocomplete="off" />
        <button id="connect" type="button">Connect</button>
        <button id="settingsToggle" class="ghost" type="button">Setup</button>
      </div>
      <div class="shoulders right">
        <button class="shoulder" data-button="R1" type="button">R1</button>
        <button class="shoulder" data-button="R2" data-trigger="rt" type="button">R2</button>
      </div>
    </header>

    <div id="settings" class="settings" hidden>
      <div class="settings-row">
        <input id="host" placeholder="TV address" autocomplete="off" />
        <select id="motion">
          <option value="gyro">Gyro look</option>
          <option value="tilt">Tilt move</option>
          <option value="off">Motion off</option>
        </select>
        <label class="sensitivity">
          Sensitivity
          <input id="sensitivity" type="range" min="0.4" max="3" step="0.1" value="1.4" />
        </label>
        <button id="recenter" class="ghost" type="button">Recenter</button>
      </div>
      <p class="hint">Same Wi-Fi as the TV. Landscape works best. Keyboard: WASD move · IJKL aim · Space shoot</p>
    </div>

    <div class="pad">
      <div id="leftStick" class="stick" aria-label="Left stick"><div class="knob"></div></div>
      <div class="center-col">
        <div class="dpad" aria-label="D-pad">
          <div class="arm v"></div>
          <div class="arm h"></div>
          <button class="mini hat n" data-hat="up" type="button">▲</button>
          <button class="mini hat s" data-hat="down" type="button">▼</button>
          <button class="mini hat w" data-hat="left" type="button">◀</button>
          <button class="mini hat e" data-hat="right" type="button">▶</button>
        </div>
        <div class="menu-row">
          <button class="mini" data-button="SELECT" type="button">SEL</button>
          <button class="mini" data-button="START" type="button">START</button>
          <button class="mini" data-button="HOME" type="button">HOME</button>
        </div>
      </div>
      <div class="face" aria-label="Face buttons">
        <button data-button="Y" class="y" type="button">Y</button>
        <button data-button="X" class="x" type="button">X</button>
        <button data-button="B" class="b" type="button">B</button>
        <button data-button="A" class="a" type="button">A</button>
      </div>
      <div id="rightStick" class="stick" aria-label="Right stick"><div class="knob"></div></div>
    </div>
    <div id="telemetry" class="telemetry">Motion gyro</div>
  </div>
  <script type="module" src="./controller.js"></script>
</body>
</html>
